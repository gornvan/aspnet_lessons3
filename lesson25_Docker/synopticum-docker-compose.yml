version: '3.8'

services:
  db:
    build:
      context: ./synopticum_db
    ports:
      - "3333:3333"
    networks:
      - app-network

  backend:
    build:
      context: ./backend_synopticum
    ports:
      - "8081:8081"  # Expose backend's 8081 to the host machine and other containers
    networks:
      - app-network
    depends_on:
      - db  # Ensure the backend starts before the frontend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:8080"  # Expose frontend's 8080 to the host machine
    depends_on:
      - backend  # Ensure the backend starts before the frontend
    environment:
      - REACT_APP_BACKEND_URL=http://backend:8081  # Pass the backend URL to the frontend


networks:
  app-network:
    driver: bridge
